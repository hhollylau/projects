<title>ISEE Vocab Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&display=swap">
<style>
:root{
  --ground:#e9edf4; --card:#fffefa; --ink:#1f2d4d; --muted:#5d6a86; --rule:#c7d6ec; --margin:#e07a74;
  --line:#d3dae6; --chip:#ffffff; --chip-on:#1f2d4d; --chip-on-ink:#ffffff;
  --know:#2f7d55; --know-bg:#e3f2e9; --learn:#b0582a; --learn-bg:#fbeadf;
  --t1:#1f2d4d; --t2:#4c6aa3; --t3:#8a94ab; --shadow:0 1px 2px rgba(31,45,77,.08),0 8px 24px rgba(31,45,77,.10);
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ground:#11151f; --card:#1b2130; --ink:#e7ecf6; --muted:#9aa6bf; --rule:#2a3550; --margin:#8f4a47;
  --line:#2c3447; --chip:#1b2130; --chip-on:#e7ecf6; --chip-on-ink:#11151f;
  --know:#7fd1a2; --know-bg:#1c3328; --learn:#f0a77c; --learn-bg:#3a2519;
  --t1:#e7ecf6; --t2:#93aee0; --t3:#7d879c; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#11151f; --card:#1b2130; --ink:#e7ecf6; --muted:#9aa6bf; --rule:#2a3550; --margin:#8f4a47;
  --line:#2c3447; --chip:#1b2130; --chip-on:#e7ecf6; --chip-on-ink:#11151f;
  --know:#7fd1a2; --know-bg:#1c3328; --learn:#f0a77c; --learn-bg:#3a2519;
  --t1:#e7ecf6; --t2:#93aee0; --t3:#7d879c; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;padding:20px 16px 40px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-family:var(--serif);font-weight:700;font-size:28px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.tabs{display:flex;gap:4px;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;color:var(--muted);font:inherit;font-weight:700;font-size:13px;padding:6px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.controls{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:52px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);font:inherit;font-size:13px;padding:5px 12px;border-radius:999px;cursor:pointer;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.chip small{opacity:.7;margin-left:4px}
button:focus-visible,input:focus-visible,select:focus-visible,.card:focus-visible{outline:2px solid var(--t2);outline-offset:2px}
select{font:inherit;font-size:13px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--chip);color:var(--ink)}

.progress{display:flex;flex-direction:column;gap:6px}
.pbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.pbar i{display:block;height:100%}
.pbar .k{background:var(--know)} .pbar .l{background:var(--learn)}
.pmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap;gap:8px}
.pmeta b{color:var(--ink)}

.stage{perspective:1400px}
.card{position:relative;width:100%;aspect-ratio:5/3;max-width:100%;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.3,1);border-radius:6px}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border-radius:6px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px 28px 28px 52px;overflow:hidden}
.face::before{content:"";position:absolute;left:36px;top:0;bottom:0;width:1.5px;background:var(--margin);opacity:.7}
.back{transform:rotateY(180deg);background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);background-position:0 56px}
.back::after{content:"";position:absolute;left:0;right:0;top:54px;height:2px;background:var(--margin);opacity:.5}
.front .word{font-family:var(--serif);font-weight:700;font-size:clamp(30px,7vw,52px);line-height:1.1;letter-spacing:-.01em;overflow-wrap:anywhere}
.front .def,.back .def{font-family:var(--serif);font-weight:500;font-size:clamp(19px,3.6vw,26px);line-height:1.3;max-width:30ch;text-wrap:balance}
.back .word{font-family:var(--serif);font-weight:700;font-size:clamp(26px,5.5vw,40px);line-height:1.1}
.pos{font-style:italic;color:var(--muted);font-family:var(--serif);font-size:16px;margin-top:6px}
.corner{position:absolute;top:14px;right:16px;display:flex;gap:6px;align-items:center}
.tier{font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:4px;border:1px solid currentColor}
.tier.t1{color:var(--t1)} .tier.t2{color:var(--t2)} .tier.t3{color:var(--t3)}
.status{font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px}
.status.known{background:var(--know-bg);color:var(--know)} .status.learning{background:var(--learn-bg);color:var(--learn)}
.hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted)}
.count{position:absolute;top:14px;left:52px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.actions{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:10px}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:12px 14px;cursor:pointer}
.btn.learn{background:var(--learn-bg);color:var(--learn);border-color:transparent}
.btn.know{background:var(--know-bg);color:var(--know);border-color:transparent}
.btn:disabled{opacity:.4;cursor:default}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.tools .row{gap:6px}
.link{border:0;background:none;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px}
kbd{font-family:var(--sans);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--chip)}

.empty{background:var(--card);border-radius:6px;box-shadow:var(--shadow);padding:40px 24px;text-align:center;color:var(--muted)}
.empty strong{display:block;font-family:var(--serif);font-size:22px;color:var(--ink);margin-bottom:6px}

.search{width:100%;font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink)}
.list{background:var(--card);border-radius:6px;box-shadow:var(--shadow);overflow:hidden}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:start}
.item:last-child{border-bottom:0}
.item .w{font-family:var(--serif);font-weight:700;font-size:17px}
.item .w em{font-weight:500;font-style:italic;color:var(--muted);font-size:14px;margin-left:6px}
.item .d{grid-column:1;color:var(--ink);opacity:.85}
.item .side{grid-row:1/span 2;grid-column:2;display:flex;gap:6px;align-items:center}
.mark{border:1px solid var(--line);background:none;color:var(--muted);font:inherit;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;cursor:pointer}
.mark.on.known{background:var(--know-bg);color:var(--know);border-color:transparent}
.mark.on.learning{background:var(--learn-bg);color:var(--learn);border-color:transparent}
.listmeta{font-size:13px;color:var(--muted)}
.confirm{display:flex;gap:8px;align-items:center;font-size:13px}

@media (max-width:520px){
  .face{padding:26px 18px 30px 40px}
  .face::before{left:26px}
  .count{left:40px}
  .actions{grid-template-columns:1fr 1fr}
  .actions .nav{order:2}
  .kbds{display:none}
  .item{grid-template-columns:1fr}
  .item .side{grid-row:auto;grid-column:1}
}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>ISEE Vocab Cards</h1>
      <p class="sub">Full Vocabulary Reference, pp. 301–309 · <span id="total"></span> words</p>
    </div>
    <div class="tabs" role="group" aria-label="View">
      <button id="tabCards" aria-pressed="true">Cards</button>
      <button id="tabList" aria-pressed="false">Word list</button>
    </div>
  </header>

  <section class="controls" aria-label="Deck filters">
    <div class="row"><span class="lbl">Deck</span><span class="row" id="deckChips"></span></div>
    <div class="row"><span class="lbl">Tier</span><span class="row" id="tierChips"></span></div>
    <div class="row"><span class="lbl">Letters</span>
      <select id="letters" aria-label="Letter range"></select>
      <span class="lbl" style="min-width:auto;margin-left:8px">Show</span>
      <select id="dir" aria-label="Card direction">
        <option value="wd">Word first</option>
        <option value="dw">Definition first</option>
      </select>
    </div>
  </section>

  <section class="progress" aria-label="Progress">
    <div class="pbar"><i class="k" id="pk"></i><i class="l" id="pl"></i></div>
    <div class="pmeta"><span><b id="nk">0</b> known · <b id="nl">0</b> still learning · <b id="nn">0</b> new</span><span id="deckSize"></span></div>
  </section>

  <main id="cardsView">
    <div class="stage" id="stage">
      <div class="card" id="card" tabindex="0" role="button" aria-label="Flashcard, press to flip">
        <div class="face front" id="front"></div>
        <div class="face back" id="back"></div>
      </div>
    </div>
    <div class="empty" id="empty" hidden><strong>No cards here</strong><span id="emptyMsg">Try another deck or tier.</span></div>
    <div style="height:14px"></div>
    <div class="actions" id="actions">
      <button class="btn nav" id="prev" aria-label="Previous card">←</button>
      <button class="btn learn" id="learnBtn">Still learning</button>
      <button class="btn know" id="knowBtn">Know it</button>
      <button class="btn nav" id="next" aria-label="Next card">→</button>
    </div>
    <div style="height:10px"></div>
    <div class="tools">
      <div class="row">
        <button class="link" id="shuffle">Shuffle</button>
        <button class="link" id="alpha">A–Z order</button>
        <span id="resetWrap"><button class="link" id="reset">Reset progress</button></span>
      </div>
      <span class="kbds"><kbd>Space</kbd> flip · <kbd>←</kbd><kbd>→</kbd> move · <kbd>K</kbd> know · <kbd>L</kbd> learning</span>
    </div>
  </main>

  <main id="listView" hidden>
    <input class="search" id="search" type="search" placeholder="Search words or definitions" aria-label="Search words">
    <div style="height:10px"></div>
    <p class="listmeta" id="listMeta"></p>
    <div class="list" id="list"></div>
  </main>
</div>

const POS = {n:"noun", v:"verb", a:"adj.", adv:"adv."};
const WORDS = RAW.split("\n").map(l => { const [w,p,t,d] = l.split("|"); return {w, p:POS[p], t:+t, d}; });
const UNITS = {
  u1: ["parole","incite","obsolete","vaccine","toxic","copious","detest","blatant","nemesis","scarce"],
  u2: ["sly","distort","exasperate","admonish","florid","vertebrate","nuance","labyrinth","cohesive","meticulous"]
};
const RANGES = [["all","All letters"],["a-c","A – C"],["d-f","D – F"],["g-l","G – L"],["m-o","M – O"],["p-r","P – R"],["s-z","S – Z"]];

const KEY = "isee-vocab-v1";
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify({marks:S.marks, deck:S.deck, tiers:S.tiers, range:S.range, dir:S.dir})); } catch(e){} }
const saved = load();
const S = {
  marks: saved.marks || {},            // word -> "known" | "learning"
  deck: saved.deck || "all",           // all | u1 | u2 | learning | new
  tiers: saved.tiers || [1,2,3],
  range: saved.range || "all",
  dir: saved.dir || "wd",
  order: [], i: 0, flipped: false, shuffled: false, view: "cards", q: ""
};

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function inRange(w){
  if (S.range === "all") return true;
  const [a,b] = S.range.split("-"); const c = w[0];
  return c >= a && c <= b;
}
function baseFiltered(){
  return WORDS.filter(x => S.tiers.includes(x.t) && inRange(x.w));
}
function deckWords(){
  let list = baseFiltered();
  if (S.deck === "u1" || S.deck === "u2") { const set = UNITS[S.deck]; list = WORDS.filter(x => set.includes(x.w)); }
  else if (S.deck === "learning") list = list.filter(x => S.marks[x.w] === "learning");
  else if (S.deck === "new") list = list.filter(x => !S.marks[x.w]);
  return list;
}
function rebuild(keepWord){
  const list = deckWords();
  S.order = list.slice();
  if (S.shuffled) shuffleArr(S.order);
  S.i = 0;
  if (keepWord){ const j = S.order.findIndex(x => x.w === keepWord); if (j >= 0) S.i = j; }
  S.flipped = false;
  render();
}
function shuffleArr(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } }

function chips(){
  const base = baseFiltered();
  const cnt = {
    all: base.length, u1: 10, u2: 10,
    learning: base.filter(x => S.marks[x.w]==="learning").length,
    new: base.filter(x => !S.marks[x.w]).length
  };
  const decks = [["all","All words"],["new","Not yet marked"],["learning","Still learning"],["u1","Unit 1"],["u2","Unit 2"]];
  $("deckChips").innerHTML = decks.map(([k,l]) =>
    `<button class="chip" data-deck="${k}" aria-pressed="${S.deck===k}">${l}<small>${cnt[k]}</small></button>`).join("");
  const tierCount = t => WORDS.filter(x => x.t===t && inRange(x.w)).length;
  $("tierChips").innerHTML = [1,2,3].map(t =>
    `<button class="chip" data-tier="${t}" aria-pressed="${S.tiers.includes(t)}">T${t}<small>${tierCount(t)}</small></button>`).join("")
    + `<span class="sub" style="margin:0 0 0 4px">T1 = covered in the workbook</span>`;
  const unit = S.deck==="u1"||S.deck==="u2";
  $("tierChips").style.opacity = unit ? .45 : 1;
  $("letters").disabled = unit;
}

function progress(){
  const list = S.view === "cards" ? S.order : deckWords();
  const n = list.length;
  const k = list.filter(x => S.marks[x.w]==="known").length;
  const l = list.filter(x => S.marks[x.w]==="learning").length;
  $("nk").textContent = k; $("nl").textContent = l; $("nn").textContent = n-k-l;
  $("pk").style.width = n ? (k/n*100)+"%" : 0;
  $("pl").style.width = n ? (l/n*100)+"%" : 0;
  $("deckSize").textContent = `${n} card${n===1?"":"s"} in this deck`;
}

function tierTag(t){ return `<span class="tier t${t}">T${t}</span>`; }
function statusTag(w){
  const m = S.marks[w]; if (!m) return "";
  return `<span class="status ${m}">${m==="known"?"Known":"Learning"}</span>`;
}

function renderCard(){
  const has = S.order.length > 0;
  $("stage").hidden = !has; $("empty").hidden = has;
  ["prev","next","learnBtn","knowBtn"].forEach(id => $(id).disabled = !has);
  if (!has){
    $("emptyMsg").textContent = S.deck==="learning" ? "Nothing marked “Still learning” in this selection yet."
      : S.deck==="new" ? "Every card in this selection has been marked. Nice work." : "Try another deck, tier or letter range.";
    return;
  }
  const x = S.order[S.i];
  const corner = `<div class="corner">${statusTag(x.w)}${tierTag(x.t)}</div>`;
  const count = `<div class="count">${S.i+1} / ${S.order.length}</div>`;
  const wordBlock = `<div class="word">${esc(x.w)}</div><div class="pos">${x.p}</div>`;
  const defBlock = `<div class="def">${esc(x.d)}</div>`;
  if (S.dir === "wd"){
    $("front").innerHTML = count + corner + wordBlock + `<div class="hint">Tap or swipe up to flip · swipe sideways for next</div>`;
    $("back").innerHTML = count + corner + `<div class="word" style="font-size:clamp(22px,4.5vw,30px);margin-bottom:14px">${esc(x.w)} <span class="pos">${x.p}</span></div>` + defBlock;
  } else {
    $("front").innerHTML = count + corner + `<div class="pos" style="margin:0 0 10px">${x.p}</div>` + defBlock + `<div class="hint">Tap or swipe up to flip · swipe sideways for next</div>`;
    $("back").innerHTML = count + corner + wordBlock + `<div class="def" style="font-size:17px;margin-top:14px;opacity:.8">${esc(x.d)}</div>`;
  }
  $("card").classList.toggle("flipped", S.flipped);
  $("card").setAttribute("aria-label", S.flipped ? "Card back, press to flip" : "Card front, press to flip");
}

function renderList(){
  const q = S.q.trim().toLowerCase();
  let list = deckWords();
  if (q) list = list.filter(x => x.w.includes(q) || x.d.toLowerCase().includes(q));
  $("listMeta").textContent = `${list.length} word${list.length===1?"":"s"}` + (q ? ` matching “${S.q.trim()}”` : "");
  $("list").innerHTML = list.length ? list.map(x => {
    const m = S.marks[x.w];
    return `<div class="item"><div class="w">${esc(x.w)}<em>${x.p}</em></div>
      <div class="side">${tierTag(x.t)}
        <button class="mark ${m==="learning"?"on learning":""}" data-w="${x.w}" data-m="learning" aria-pressed="${m==="learning"}">Learning</button>
        <button class="mark ${m==="known"?"on known":""}" data-w="${x.w}" data-m="known" aria-pressed="${m==="known"}">Known</button></div>
      <div class="d">${esc(x.d)}</div></div>`;
  }).join("") : `<div class="item"><div class="d">No words match.</div></div>`;
}

function render(){
  chips(); progress();
  $("letters").value = S.range; $("dir").value = S.dir;
  $("cardsView").hidden = S.view !== "cards"; $("listView").hidden = S.view !== "list";
  $("tabCards").setAttribute("aria-pressed", S.view==="cards");
  $("tabList").setAttribute("aria-pressed", S.view==="list");
  $("shuffle").style.fontWeight = S.shuffled ? 700 : 400;
  $("alpha").style.fontWeight = S.shuffled ? 400 : 700;
  if (S.view === "cards") renderCard(); else renderList();
}

function flip(){ if (!S.order.length) return; S.flipped = !S.flipped; renderCard(); }
function go(d){
  if (!S.order.length) return;
  S.i = (S.i + d + S.order.length) % S.order.length; S.flipped = false; render();
}
function mark(m){
  if (!S.order.length) return;
  const x = S.order[S.i];
  S.marks[x.w] = m; save();
  // In filtered review decks, a marked card leaves the deck
  if ((S.deck==="new") || (S.deck==="learning" && m==="known")){
    S.order.splice(S.i,1);
    if (S.i >= S.order.length) S.i = 0;
    S.flipped = false; render();
  } else go(1);
}

$("letters").innerHTML = RANGES.map(([v,l]) => `<option value="${v}">${l}</option>`).join("");
$("total").textContent = WORDS.length;

$("deckChips").addEventListener("click", e => { const b = e.target.closest("[data-deck]"); if (!b) return; S.deck = b.dataset.deck; save(); rebuild(); });
$("tierChips").addEventListener("click", e => {
  const b = e.target.closest("[data-tier]"); if (!b) return; const t = +b.dataset.tier;
  if (S.tiers.includes(t)) { if (S.tiers.length > 1) S.tiers = S.tiers.filter(x => x!==t); }
  else S.tiers = [...S.tiers, t].sort();
  save(); rebuild();
});
$("letters").addEventListener("change", e => { S.range = e.target.value; save(); rebuild(); });
$("dir").addEventListener("change", e => { S.dir = e.target.value; S.flipped = false; save(); render(); });
$("card").addEventListener("click", flip);
$("prev").addEventListener("click", () => go(-1));
$("next").addEventListener("click", () => go(1));
$("knowBtn").addEventListener("click", () => mark("known"));
$("learnBtn").addEventListener("click", () => mark("learning"));
$("shuffle").addEventListener("click", () => { S.shuffled = true; rebuild(); });
$("alpha").addEventListener("click", () => { S.shuffled = false; rebuild(S.order[S.i] && S.order[S.i].w); });
$("tabCards").addEventListener("click", () => { S.view = "cards"; rebuild(); });
$("tabList").addEventListener("click", () => { S.view = "list"; render(); });
$("search").addEventListener("input", e => { S.q = e.target.value; renderList(); });
$("list").addEventListener("click", e => {
  const b = e.target.closest(".mark"); if (!b) return;
  const w = b.dataset.w, m = b.dataset.m;
  if (S.marks[w] === m) delete S.marks[w]; else S.marks[w] = m;
  save(); chips(); progress(); renderList();
});
function resetUI(){
  $("resetWrap").innerHTML = `<button class="link" id="reset">Reset progress</button>`;
  $("reset").addEventListener("click", () => {
    $("resetWrap").innerHTML = `<span class="confirm">Clear all marks? <button class="link" id="yes">Yes, clear</button><button class="link" id="no">Cancel</button></span>`;
    $("yes").addEventListener("click", () => { S.marks = {}; save(); resetUI(); rebuild(); });
    $("no").addEventListener("click", resetUI);
  });
}
resetUI();

document.addEventListener("keydown", e => {
  if (S.view !== "cards" || e.target.matches("input,select,textarea")) return;
  if (e.key === " " || e.key === "Enter"){ if (e.target.closest("button") && e.target.id!=="card") return; e.preventDefault(); flip(); }
  else if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
  else if (e.key.toLowerCase() === "k") mark("known");
  else if (e.key.toLowerCase() === "l") mark("learning");
});

// swipe on touch screens
// swipe: left/right moves between cards, up/down flips the card
let sx = null, sy = null;
$("card").addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
$("card").addEventListener("touchend", e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  sx = sy = null;
  const ax = Math.abs(dx), ay = Math.abs(dy);
  if (Math.max(ax, ay) < 40) return;          // a tap; the click handler flips
  e.preventDefault();                          // stop the tap-flip after a swipe
  if (ax > ay) go(dx < 0 ? 1 : -1);
  else flip();
});

rebuild();
</script>
